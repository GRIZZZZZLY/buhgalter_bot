# Golden test cases for ParserService
# Purpose: catch regressions when YAML patterns or parser logic changes
# Format: input -> expected transaction_type, category, amount, confidence_label

cases:
  - id: expense_coffee
    input: "купил кофе 150"
    expected:
      transaction_type: expense
      category: food
      amount: 150
      confidence_label: high

  - id: income_salary_short
    input: "зп 80000"
    expected:
      transaction_type: income
      category: salary
      amount: 80000
      confidence_label: high

  - id: expense_taxi
    input: "такси 600"
    expected:
      transaction_type: expense
      category: transport
      amount: 600
      confidence_label: high

  - id: expense_rent
    input: "аренда 45000"
