ru:
  patterns:
    - name: P1
      regex: '^(?P<type>расход|доход)\s+(?P<amount>\d+(?:[\.,]\d{1,2})?)\s+(?P<category>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)$'
    - name: P8
      regex: '^(?P<verb>[\wёЁа-яА-Я-]+)\s+(?P<desc>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)\s+на\s+(?P<amount>\d+(?:[\.,]\d{1,2})?)(?:\s*(?:руб(?:ля|лей)?|р|₽))?$'
    - name: P9
      regex: '^(?P<verb>[\wёЁа-яА-Я-]+)\s+на\s+(?P<amount>\d+(?:[\.,]\d{1,2})?)(?:\s*(?:руб(?:ля|лей)?|р|₽))?\s+(?P<desc>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)$'
    - name: P10
      regex: '^(?P<verb>[\wёЁа-яА-Я-]+)\s+в\s+(?P<desc>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)\s+на\s+(?P<amount>\d+(?:[\.,]\d{1,2})?)(?:\s*(?:руб(?:ля|лей)?|р|₽))?$'
    - name: P11
      regex: '^(?P<verb>[\wёЁа-яА-Я-]+)\s+(?P<amount>\d+(?:[\.,]\d{1,2})?)(?:\s*(?:руб(?:ля|лей)?|р|₽))?\s+за\s+(?P<desc>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)$'
    - name: P12
      regex: '^(?P<verb>[\wёЁа-яА-Я-]+)\s+за\s+(?P<desc>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)\s+(?P<amount>\d+(?:[\.,]\d{1,2})?)(?:\s*(?:руб(?:ля|лей)?|р|₽))?$'
    - name: P3
      regex: '^(?P<amount>\d+(?:[\.,]\d{1,2})?)\s+на\s+(?P<category>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)$'
    - name: P2
      regex: '^(?P<amount>\d+(?:[\.,]\d{1,2})?)\s+(?P<category>(?!на\b)[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)$'
    - name: P4
      regex: '^(?P<verb>[\wёЁа-яА-Я-]+)\s+(?P<amount>\d+(?:[\.,]\d{1,2})?)\s+на\s+(?P<desc>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)$'
    - name: P6
      regex: '^(?P<sign>[\+\-])(?P<amount>\d+(?:[\.,]\d{1,2})?)\s+(?P<desc>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)$'
    - name: P7
      regex: '^(?P<verb>[\wёЁа-яА-Я-]+)\s+(?P<amount>\d+(?:[\.,]\d{1,2})?)\s+(?P<desc>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)$'
    - name: P14
      regex: '^(?P<category>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)\s+на\s+(?P<amount>\d+(?:[\.,]\d{1,2})?)$'
    - name: P13
      regex: '^(?P<verb>[\wёЁа-яА-Я-]+)\s+(?P<desc>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)\s+(?P<amount>\d+(?:[\.,]\d{1,2})?)$'
    - name: P5
      regex: '^(?P<category>[\wёЁа-яА-Я-]+(?:\s+[\wёЁа-яА-Я-]+)*)\s+(?P<amount>\d+(?:[\.,]\d{1,2})?)$'
